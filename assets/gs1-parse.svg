          <p class="kind">AI agents</p>
          <h3>agent-harness</h3>
          <p class="what">A tested harness for long-running LLM agents: the model proposes tool calls, plain code decides. Budgets, failure limits, loop detection, a kill switch, prompt-injection guardrails, sandboxed tools, parallel sub-agents and traces.</p>
          <p class="proof"><b>8 / 8</b> tasks done and <b>6 / 6</b> attacks harmless with a local 27B model; 26 tests make each guardrail hold even when the model obeys the attacker.</p>
          <p class="stack">Python standard library, OpenAI-compatible API, macOS sandbox</p>
          <a class="go" href="https://github.com/akincenk/agent-harness" target="_blank" rel="noopener">View on GitHub</a>
        </article>
        <article class="tile">
          <div class="art" aria-hidden="true"><svg viewBox="0 0 200 100"><rect class="frame" x="26" y="14" width="56" height="72" rx="6"/><g class="soft"><rect x="36" y="26" width="36" height="5" rx="2.5"/><rect x="36" y="37" width="30" height="5" rx="2.5"/><rect x="36" y="48" width="36" height="5" rx="2.5"/><rect x="36" y="59" width="24" height="5" rx="2.5"/></g><rect class="hl" x="34" y="46" width="40" height="9" rx="3"/><rect class="bubble" x="104" y="20" width="72" height="22" rx="11"/><rect class="bubblea" x="96" y="52" width="80" height="28" rx="14"/><path class="line" d="M82 50H94"/></svg></div>
          <p class="kind">RAG</p>
          <h3>InsightAI</h3>
          <p class="what">Question answering over PDFs with page citations. Vector, BM25 keyword and hybrid retrieval, with the default chosen by measurement, not by preference.</p>
          <p class="proof">Vector search ranked the right page best (MRR <b>0.94</b> on 30 questions, against <b>0.78</b> for keywords and <b>0.90</b> for hybrid) and had it in the top 3 every time, so vector is the default.</p>
          <p class="stack">FastAPI, PyMuPDF, embeddings, recall@k / MRR evaluation</p>
          <a class="go" href="https://github.com/akincenk/insightai" target="_blank" rel="noopener">View on GitHub</a>
        </article>
        <article class="tile">
          <div class="art" aria-hidden="true"><svg viewBox="0 0 200 100"><circle class="fill" cx="30" cy="50" r="9"/><path class="line" d="M39 50H80M80 50 120 24M80 50 120 76"/><path class="line a" d="M120 24H170"/><path class="dash" d="M120 76H170"/><g class="node"><circle cx="120" cy="24" r="7"/><circle cx="120" cy="76" r="7"/></g><rect class="bubblea" x="160" y="14" width="26" height="20" rx="6"/><rect class="bubble" x="160" y="66" width="26" height="20" rx="6"/></svg></div>
          <p class="kind">LLM infrastructure</p>
          <h3>llm-router</h3>
          <p class="what">Sends each question to the cheapest model that can answer it, and skips the model when the same question was already answered. Explainable rules, a cascade with escalation and a semantic cache that never mixes up numbers.</p>
          <p class="proof">Same <b>100%</b> accuracy as always using the large model at <b>58% lower cost</b>; the cache answered <b>14 / 15</b> reworded questions and was fooled by <b>0 / 5</b> number traps.</p>
          <p class="stack">Python standard library, semantic cache, cost and accuracy evaluation</p>
          <a class="go" href="https://github.com/akincenk/llm-router" target="_blank" rel="noopener">View on GitHub</a>
        </article>
      </div>
    </div>
  </section>

