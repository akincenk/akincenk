          <p class="kind">AI agents</p>
          <h3>agent-harness</h3>
          <p class="what">A tested harness for long-running LLM agents: the model proposes tool calls, plain code decides. Budgets, failure limits, loop detection, a kill switch, prompt-injection guardrails, sandboxed tools, parallel sub-agents and traces.</p>
          <p class="proof"><b>8 / 8</b> tasks done and <b>6 / 6</b> attacks harmless with a local 27B model; 26 tests make each guardrail hold even when the model obeys the attacker.</p>
          <p class="stack">Python standard library, OpenAI-compatible API, macOS sandbox</p>
          <a class="go" href="https://github.com/akincenk/agent-harness" target="_blank" rel="noopener">View on GitHub</a>
        </article>
