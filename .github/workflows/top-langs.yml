name: Top languages card

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0  # zizmor: ignore[artipacked] job pushes the cards back with this token
      - run: python3 scripts/top_langs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANGS_TOKEN: ${{ secrets.LANGS_TOKEN }}
      - run: python3 scripts/streak.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANGS_TOKEN: ${{ secrets.LANGS_TOKEN }}
      - run: |
          git diff --quiet assets/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs*.svg assets/streak*.svg
          git commit -m "Update profile cards"
          git push
